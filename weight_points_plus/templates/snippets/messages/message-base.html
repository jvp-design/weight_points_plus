<div class="rounded-md {% block main_color %}{% endblock main_color %} p-4" id="div-{{ id }}">
  <div class="flex">
    <div class="flex-shrink-0">
      {% block icon %}{% endblock icon %}
    </div>
    <div class="ml-3">
      <p class="text-sm font-medium {% block text_color %}{% endblock text_color %}">{{ message }}</p>
    </div>
    <div class="ml-auto pl-3">
      <div class="-mx-1.5 -my-1.5">
        <button type="button" id="message-{{ id }}" class="inline-flex {% block close_icon_color %}{% endblock close_icon_color %} rounded-md p-1.5 focus:outline-none focus:ring-2 focus:ring-offset-2">
          <span class="sr-only">Dismiss</span>
          <!-- Heroicon name: solid/x -->
          <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

{% block inline_javascript %}
  <script>
  document.querySelector('#message-{{ id }}').addEventListener('click', () => {
    document.querySelector('#div-{{ id }}').classList.add('hidden')
  })
  </script>
{% endblock inline_javascript %}
