<div>
  {{ meal.name }} - {{ meal.points }}
  <form method="get" action="{% url 'meal:items-search' meal.pk %}">
    <input type="text" name="name">
    <button type="submit">Search</button>
  </form>
  {% for item in meal.fooditeminstance_set.all %}
    <div>
      {{ item.food.name }}, {{ item.serving_size }}{{ item.serving_unit.lower }} -> {{ item.points }}
      <a href="{% url 'meal:update-food-item' meal.pk item.pk %}">Edit</a>
    </div>
  {% endfor %}
</div>
