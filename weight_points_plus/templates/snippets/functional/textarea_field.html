<div class="{{ class }}">
  <div class="flex justify-between">
    <label for="{{ id }}" class="block text-sm font-medium text-contrast">
      {{ label }}
    </label>
    {% if required %}
      <span class="text-sm text-contrast-dark" id="{{ id }}-required">Required</span>
    {% endif %}
  </div>
  <div class="mt-1">
    <textarea
      rows="4"
      id="{{ id }}"
      name="{{ name }}"
      {% if required %}
      required
      {% endif %}
      class="shadow-sm focus:ring-accent focus:border-accent block w-full sm:text-sm border-gray-300 rounded-md bg-contrast-light"
      {% if placeholder is not None %}
      placeholder="{{ placeholder }}"
      {% endif %}
      aria-describedby="{{ id }}-field"
      {% if value.strip %}
      value="{{ value }}"
      {% endif %}
    ></textarea>
  </div>
  {% if hint %}
    <p class="mt-2 text-sm text-gray-500" id="{{ id }}-field">{{ hint }}</p>
{% endif %}
  {% if errors %}
    {% for error in errors %}
      <p class="mt-2 text-sm text-red-600" id="{{ id }}-error">{{ error}}</p>
    {% endfor %}
  {% endif %}
</div>
