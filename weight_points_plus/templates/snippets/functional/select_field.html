<div class="{{ class }}">
  <label for="{{ id }}" class="block text-sm font-medium text-gray-700">{{ label }}</label>
  <select id="{{ id }}" name="{{ name }}" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm rounded-md">
    {% for option in options %}
      {% if option.0 != '' %}
      <option {% if selected == option.0 %}selected{% endif %} value="{{ option.0 }}">{{ option.1 }}</option>
      {% endif %}
    {% endfor %}
  </select>
  {% if errors %}
    {% for error in errors %}
      <p class="mt-2 text-sm text-red-600" id="{{ id }}-error">{{ error}}</p>
    {% endfor %}
  {% elif hint is not None %}
    <p class="mt-2 text-sm text-gray-500" id="{{ id }}-field">{{ hint }}</p>
  {% endif %}
</div>
