<div class="{{ class }}">
  <div class="flex justify-between">
    <label for="{{ id }}" class="block text-sm font-medium text-contrast">
      {{ label }}
    </label>
    {% if required %}
      <span class="text-sm text-contrast-dark" id="{{ id }}-required">Required</span>
    {% endif %}
  </div>
  <div class="mt-1 relative">
    <input
      type="text"
      id="{{ id }}"
      name="{{ name }}"
      {% if required %}
      required
      {% endif %}
      class="shadow-sm focus:ring-accent focus:border-accent block w-full sm:text-sm border-gray-300 rounded-md bg-contrast-light"
      {% if placeholder is not None %}
      placeholder="{{ placeholder }}"
      {% endif %}
      aria-describedby="{{ id }}-field"
      {% if format %}
      value="{{ value|date:format }}"
      {% elif value is not None %}
      value="{{ value }}"
      {% endif %}
    >
    <div class="absolute inset-y-0 right-0 flex items-center">
      <label for="{{ select_id }}" class="sr-only">{{ select_label }}</label>
      <select id="{{ select_id }}" name="{{ select_name }}" class="focus:ring-indigo-500 focus:border-indigo-500 h-full py-0 pl-2 pr-7 border-transparent bg-transparent text-gray-500 sm:text-sm rounded-md">
        {% for option in options %}
          <option {% if selected == option.0 %}selected{% endif %} value="{{ option.0 }}">{{ option.0 }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  {% if hint %}
    <p class="mt-2 text-sm text-contrast-dark" id="{{ id }}-field">{{ hint }}</p>
  {% endif %}
  {% if errors %}
    {% for error in errors %}
      <p class="mt-2 text-sm text-red-600" id="{{ id }}-error">{{ error}}</p>
    {% endfor %}
  {% endif %}
</div>
