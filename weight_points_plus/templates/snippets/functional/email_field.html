<div class="{{ class }}">
  <label for="{{ id }}" class="block text-sm font-medium text-gray-700">
    {{ label}}
  </label>
  <div class="mt-1">
    <input
      id="{{ id }}"
      name="{{ name }}"
      type="email"
      autocomplete="email"
      {% if required %}
      required
      {% endif %}
      class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm"
      aria-describedby="email-field"
    />
  </div>
  {% for error in errors %}
    <p class="mt-2 text-sm text-red-600" id="{{ id }}-error">{{ error}}</p>
  {% endfor %}
</div>
