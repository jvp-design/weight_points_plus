<div class="{{ class }}">
  <div class="flex justify-between">
    <label for="{{ id }}" class="block text-sm font-medium text-contrast">
      {{ label }}
    </label>
    {% if required %}
      <span class="text-sm text-contrast-dark" id="{{ id }}-required">Required</span>
    {% endif %}
  </div>
  <div class="mt-1">
    <input
      id="{{ id }}"
      name="{{ name }}"
      type="email"
      autocomplete="email"
      {% if required %}
      required
      {% endif %}
      class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-accent focus:border-accent sm:text-sm bg-contrast-light"
      aria-describedby="email-field"
      {% if value is not None %}
      value="{{ value }}"
      {% endif %}
    />
  </div>
  {% for error in errors %}
    <p class="mt-2 text-sm text-red-600" id="{{ id }}-error">{{ error}}</p>
  {% endfor %}
</div>
