<div class={{ class }}>
  <label for="{{ id }}" class="block text-sm font-medium text-gray-700">
    {{ label }}
  </label>
  <div class="mt-1 relative">
    <input
      id="{{ id }}"
      name="{{ name }}"
      type="password"
      autocomplete="current-password"
      {% if required %}
      required
      {% endif %}
      {% if errors %}
      class="appearance-none block w-full px-3 py-2 border border-red-300 text-red-900 placeholder-red-300 focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm rounded-md bg-red-100" aria-invalid="true" aria-describedby="email-error"
      {% else %}
      class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-accent focus:border-accent sm:text-sm bg-contrast-light"
      {% endif %}
    />
    <div
      class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer"
      id="visibility-icon-{{ password_number }}"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 20 20"
        fill="currentColor"
        id="eye-off-{{ password_number }}"
      >
        <path
          fill-rule="evenodd"
          d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z"
          clip-rule="evenodd"
        />
        <path
          d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z"
        />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 hidden"
        viewBox="0 0 20 20"
        fill="currentColor"
        id="eye-on-{{ password_number }}"
      >
        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
        <path
          fill-rule="evenodd"
          d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
  </div>
  {% for error in errors %}
    <p class="mt-2 text-sm text-red-600" id="{{ id }}-error">{{ error}}</p>
  {% endfor %}
</div>

<noscript>
  <style>
    #visibility-icon-{{ password_number }}{
      display:none;
    }
  </style>
</noscript>
