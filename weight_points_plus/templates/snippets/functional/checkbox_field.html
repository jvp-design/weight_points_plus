<div class="relative flex items-start {{ class }}">
    <div class="flex items-center h-5">
      <input
        id="{{ id }}"
        aria-describedby="{{ id }}-description"
        name="{{ name }}"
        type="checkbox"
        class="focus:ring-accent h-4 w-4 text-accent border-gray-300 rounded bg-contrast-light"
        {% if checked %}checked{% endif %}
      >
    </div>
    <div class="ml-3 text-sm">
      <label for="{{ id }}" class="font-medium text-contrast">{{ label }}</label>
      {% if hint %}
      <p id="{{ id }}-description" class="text-contrast-dark">{{ hint }}</p>
      {% endif %}
    </div>
  </div>
