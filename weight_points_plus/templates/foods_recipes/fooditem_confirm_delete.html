{% block content %}

  <div class="max-w-2xl mx-auto">
  {% include 'snippets/food_detail_snippet.html' %}

<div class="sm:flex pt-2">

  <input type="submit" class="btn-primary sm:mx-2 my-2 sm:my-0 cursor-pointer" value="Confirm Delete" />
</div>
    </div>
    </form>

{% endblock content %}
