{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
    <div class="px-4 py-6 sm:mt-12 rounded-lg bg-contrast overflow-hidden shadow max-w-4xl mx-auto md:grid md:place-items-center lg:px-8 min-h-[300px]">
    <div class="max-w-max mx-auto">
      <div class="sm:flex">
        <p class="text-4xl font-extrabold text-accent sm:text-5xl">500</p>
        <div class="sm:ml-6">
          <div class="sm:border-l sm:border-gray-200 sm:pl-6">
            <h1 class="text-2xl font-extrabold text-primary tracking-tight sm:text-3xl">Ooops!!! Looks like something went wrong!</h1>
            <p class="mt-1 text-base text-primary-dark">We track these errors automatically, but if the problem persists feel free to contact us. In the meantime, try refreshing.</p>
          </div>
          <div class="mt-10 flex space-x-3 sm:pl-6">
            <a href="/" class="btn-primary sm:w-1/2 sm:mx-auto"> Go back home </a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
