[flake8]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,venv
ignore =
    # Ignore non-PEP-8-compliant format rule
    E203,
    # Black is managing line length
    E501,
    # See: https://black.readthedocs.io/en/stable/faq.html?highlight=flake8#why-are-flake8-s-e203-and-w503-violated
    W503,
enable-extensions = W504

[pycodestyle]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,venv

[isort]
;line_length = 88
;known_first_party = weight_points_plus,config
;multi_line_output = 3
;default_section = THIRDPARTY
;skip = venv/
;skip_glob = **/migrations/*.py
;include_trailing_comma = true
;force_grid_wrap = 0
;use_parentheses = true
profile = black

[coverage:run]
branch = True
include = weight_points_plus/*
omit = *migrations*, *tests*
plugins =
    django_coverage_plugin

[coverage:report]
show_missing = True
skip_covered = True

[mypy]
python_version = 3.9
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
ignore_errors = False
ignore_missing_imports = True
strict_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
warn_return_any = True
namespace_packages = True
explicit_package_bases = True
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = config.settings.test

[mypy-*.migrations.*]
# Django migrations should not produce any errors:
ignore_errors = True
