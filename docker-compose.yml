# Use root/example as user/password credentials
version: "3.1"

volumes:
  local_pg_data: {}
#  local_mongo_data_backups: {}

services:
  postgres:
    image: postgres
    ports:
      - "5433:5432"
    volumes:
      - local_pg_data:/var/lib/postgresql/data:Z
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=weight_points_plus

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DATABASE_URL=postgres://user:password@postgres:5432/weight_points_plus
      - EMAIL_HOST=mailhog
    depends_on:
      - postgres
      - mailhog

  mailhog:
    image: mailhog/mailhog:v1.0.0
    container_name: mailhog_weight_points_plus
    ports:
      - "8025:8025"
      - "1025:1025"
